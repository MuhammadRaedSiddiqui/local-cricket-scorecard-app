name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      JWT_SECRET: ci-only-ephemeral-jwt-secret-not-for-deployment
      PUSHER_APP_ID: 123456
      NEXT_PUBLIC_PUSHER_KEY: ci-placeholder-key
      PUSHER_SECRET: ci-placeholder-secret
      NEXT_PUBLIC_PUSHER_CLUSTER: eu
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      DATABASE_URL: postgresql://cricket:cricket@127.0.0.1:5432/cricket_ci
      PGSSLMODE: disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cricket
          POSTGRES_PASSWORD: cricket
          POSTGRES_DB: cricket_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U cricket -d cricket_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_START_SERVER: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
