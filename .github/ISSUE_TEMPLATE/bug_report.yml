name: Bug report
description: Report reproducible application behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials or personal data. Report security issues privately using SECURITY.md.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the page, actions, expected result, and actual result.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, and commit or deployment URL.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or redacted diagnostics
